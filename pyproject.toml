[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DepthMark"
version = "2.0.0"
description = "DepthMark: source-isolated FotMob and Oddspedia football data warehouse"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DepthMark Team"},
]
keywords = ["scraper", "sports", "football", "fotmob", "oddspedia", "data-warehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.2",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "curl-cffi>=0.7.0",
    "browser-cookie3>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "clickhouse-connect>=0.6.0",
    "pymongo>=4.8.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "filelock>=3.13.0",
    "urllib3>=2.0.0",
    "tenacity>=8.2.3",
    "tqdm>=4.66.0",
    "boto3>=1.28.0",
    "structlog>=24.4.0",
    "undetected-chromedriver>=3.5.5",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "jsonschema>=4.20.0",
    "mypy>=1.7.1",
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
    "setuptools>=68.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
    "types-beautifulsoup4>=4.12.0",
    "pandas-stubs>=2.1.0",
]

cloudflare = []

[project.scripts]
depthmark = "src.cli:main"

[project.urls]
Homepage = "https://github.com/SoroushGhaderi/DepthMark"
Repository = "https://github.com/SoroushGhaderi/DepthMark"
Issues = "https://github.com/SoroushGhaderi/DepthMark/issues"

[tool.setuptools.packages.find]
# DepthMark runs from a source checkout (`uv sync` or `pip install -e .`): commands
# read clickhouse/ SQL, catalogs and config files from the checkout.
include = ["src*", "scripts*", "config*"]
namespaces = true

[tool.setuptools.package-data]
src = ["py.typed"]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Import src/, scripts/ and config/ from the checkout without an install.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
# Command logic lives in src/ (scripts/ are shims), so this counts every command.
source = ["src", "config"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# Measured 65% on 2026-10-31; raise the floor as coverage grows, never lower it.
fail_under = 64
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "logs", "htmlcov"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "BLE",    # blind except
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    "G004",   # f-string in logging call
]
# Long lines the formatter cannot split (SQL, URLs, messages) are left to review.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "config"]
